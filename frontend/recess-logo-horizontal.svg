<svg viewBox="0 0 340 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: a school recess bell, simplified -->
  <g transform="translate(10,10)">
    <!-- knob -->
    <circle cx="35" cy="10" r="3.5" fill="#26364A"/>
    <rect x="33" y="12" width="4" height="6" fill="#26364A"/>
    <!-- bell body -->
    <path d="M15,46
             Q15,17 35,17
             Q55,17 55,46
             L61,54
             Q61,60 55,60
             L15,60
             Q9,60 9,54
             Z"
          fill="#26364A"/>
    <!-- base line -->
    <rect x="9" y="60" width="52" height="4" rx="2" fill="#26364A"/>
    <!-- clapper -->
    <line x1="35" y1="64" x2="35" y2="70" stroke="#26364A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="35" cy="75" r="4.5" fill="#B08D45"/>
  </g>

  <!-- Wordmark -->
  <text x="95" y="52" font-family="Inter, ui-sans-serif, system-ui" font-weight="700" font-size="32" fill="#1C1B19" letter-spacing="-0.5">Recess Forum</text>
  <text x="97" y="72" font-family="Inter, ui-sans-serif, system-ui" font-weight="500" font-size="13" fill="#9A968A" letter-spacing="0.2">for parents navigating school</text>
</svg>
